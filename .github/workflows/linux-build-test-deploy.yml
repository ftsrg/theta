name: Linux build-test-deploy
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
    inputs:
      message:
        description: 'Summarize the contents since the last version'
        required: true
        default: 'Auto-generated release'

permissions: write-all

concurrency: 
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check-release:
    runs-on: ubuntu-24.04
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
      message: ${{ steps.check.outputs.message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Determine if this is a release trigger
        id: check
        uses: ./.github/actions/check-release
        with:
          workflow-message: ${{ inputs.message }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}


  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle build (no tests)
        uses: ./.github/actions/cache-build
        with:
          arguments: build -x test
      - name: Upload JARs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v3.1.2
        with:
          name: ThetaJars
          path: subprojects/**/*-all.jar
      - name: Positive outcome badge
        uses: ./.github/actions/badge-creation
        with:
          label: "${{ runner.os }} build"
          status: "Success"
          color: "green"
          path: "badges/build-${{ runner.os }}"
      - name: Negative outcome badge
        if: ${{ failure() }}
        uses: ./.github/actions/badge-creation
        with:
          label: "${{ runner.os }} build"
          status: "Failure"
          color: "red"
          path: "badges/build-${{ runner.os }}"


  test-benchexec:
    strategy:
      matrix:
        include:
          # software
          - tool: Theta-svcomp
            config: "--svcomp --portfolio STABLE --loglevel RESULT"
            name: SV-COMP_Portfolio_Stable
            input_type: software
          - tool: EmergenTheta-svcomp
            config: "--svcomp --portfolio EMERGENT --loglevel RESULT"
            name: SV-COMP_Portfolio_Emergent
            input_type: software
          - tool: Thorn-svcomp
            config: "--svcomp --portfolio HORN --loglevel RESULT"
            name: SV-COMP_Portfolio_Horn
            input_type: software
          # chc
          - tool: Theta-chccomp
            config: "--backend PORTFOLIO --portfolio CHC-COMP --print-model --loglevel RESULT"
            name: CHC-COMP_Portfolio
            input_type: chc
          # hardware
          - tool: Theta-sts
            config: "--algorithm CEGAR"
            name: Hardware_CEGAR
            input_type: hardware
          # petrinet
          - tool: Theta-xsts
            config: "MDD"
            name: PetriNet_MDD
            input_type: petrinet
          - tool: Theta-xsts
            config: "PN_MDD"
            name: PetriNet_PN_MDD
            input_type: petrinet
          # plc
          - tool: Theta-cfa
            config: "--algorithm CEGAR"
            name: PLC_CEGAR
            input_type: plc
          # statechart
          - tool: Theta-xsts
            config: "CEGAR"
            name: Statechart_CEGAR
            input_type: statechart
    runs-on: ubuntu-24.04
    needs: create-archives
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Run benchexec
        uses: ./.github/actions/benchexec-test
        with:
          name: ${{ matrix.name }}
          config_options: ${{ matrix.config }}
          tool: ${{ matrix.tool }}
          input_type: ${{ matrix.input_type }}
  
  collect-results:
    needs: test-benchexec
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Generate report
        uses: ./.github/actions/benchexec-report


  create-archives:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        include:
          # xcfa-cli
          - toolName: Theta-svcomp
            gradleTask: buildArchiveTheta-svcomp
          - toolName: EmergenTheta-svcomp
            gradleTask: buildArchiveEmergenTheta-svcomp
          - toolName: Thorn-svcomp
            gradleTask: buildArchiveThorn-svcomp
          - toolName: Theta-chccomp
            gradleTask: buildArchiveTheta-chccomp
          # xsts-cli
          - toolName: Theta-xsts
            gradleTask: buildArchiveTheta-xsts
          # sts-cli
          - toolName: Theta-sts
            gradleTask: buildArchiveTheta-sts
          # cfa-cli
          - toolName: Theta-cfa
            gradleTask: buildArchiveTheta-cfa
          # xta-cli
          - toolName: Theta-xta
            gradleTask: buildArchiveTheta-xta
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Build archive variant
        uses: ./.github/actions/cache-build
        with:
          arguments: ${{ matrix.gradleTask }}
      - name: Move to cwd
        run: mv subprojects/*/*/build/distributions/${{ matrix.toolName }}.zip ${{ matrix.toolName }}.zip
      - name: Upload archive artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v3.1.2
        with:
          name: release-${{ matrix.toolName }}
          path: ${{ matrix.toolName }}.zip
          if-no-files-found: error


  canary-test:
    needs: create-archives
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v3.0.2
        name: Get the Theta-svcomp archive
        with:
          name: release-Theta-svcomp
          path: subprojects/xcfa/xcfa-cli/build/distributions/
      # Only the files the two registries name: a full checkout is several GB, and the suite reads
      # nothing else. `blob:none` keeps the clone metadata-only until the sparse paths are resolved.
      - name: Fetch the referenced sv-benchmarks tasks
        run: |
          canaries=subprojects/xcfa/xcfa-cli/canaries/canaries.tsv
          awk -F'\t' 'NR==1 { for (i = 1; i <= NF; i++) c[$i] = i; next }
                      { print $c["input_file_relpath"]; print $c["property_file_relpath"] }' \
            "$canaries" | sort -u > /tmp/sparse-paths
          echo 'c/properties/*' >> /tmp/sparse-paths
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://gitlab.com/sosy-lab/benchmarking/sv-benchmarks.git ../sv-benchmarks
          cd ../sv-benchmarks
          git sparse-checkout init --no-cone
          git sparse-checkout set --stdin < /tmp/sparse-paths
          git checkout
      # The archive is already built above, so skip the task that would rebuild it; the suite
      # unpacks the downloaded zip itself.
      - name: Run the canary and fixture suites
        run: ./gradlew :theta-xcfa-cli:canaryTest -x buildArchiveTheta-svcomp -Ptheta.canary.jobs=2
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v3.1.2
        with:
          name: CanarySuiteReport
          path: subprojects/xcfa/xcfa-cli/build/reports/tests/
          if-no-files-found: ignore


  javadoc:
    needs: [build, check-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Generate aggregate Javadoc
        uses: ./.github/actions/cache-build
        with:
          arguments: javadoc
      - name: Deploy Javadoc
        if: needs.check-release.outputs.is-release == 'true'
        uses: JamesIves/github-pages-deploy-action@22a6ee251d6f13c6ab1ecb200d974f1a6feb1b8d # v4.4.2
        with:
          branch: gh-pages
          folder: build/docs/javadoc
          target-folder: javadoc
          single-commit: true

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle test
        uses: ./.github/actions/cache-build
        with:
          arguments: test
      - name: Positive outcome badge
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: ./.github/actions/badge-creation
        with:
          label: "${{ runner.os }} test"
          status: "Success"
          color: "green"
          path: "badges/test-${{ runner.os }}"
      - name: Negative outcome badge
        if: ${{ failure() && matrix.os == 'ubuntu-24.04' }}
        uses: ./.github/actions/badge-creation
        with:
          label: "${{ runner.os }} test"
          status: "Failure"
          color: "red"
          path: "badges/test-${{ runner.os }}"


  deploy-release:
    needs: [create-archives, check-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Set java home to java 21
        run: |
          echo "JAVA_HOME=$(echo $JAVA_HOME_21_X64)" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Create release and deploy JARs
        uses: ./.github/actions/create-release
        with:
          message: ${{ needs.check-release.outputs.message }}
          dry-run: ${{ needs.check-release.outputs.is-release != 'true' }}

  deploy-zenodo:
    needs: [create-archives, check-release]
    if: needs.check-release.outputs.is-release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - tool: Theta
            artifact: Theta-svcomp
            record: 14194483
          - tool: EmergenTheta
            artifact: EmergenTheta-svcomp
            record: 15536866
          - tool: Thorn
            artifact: Thorn-svcomp
            record: 14194485
          - tool: ThetaCHC
            artifact: Theta-chccomp
            record: 15537027
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Create zenodo release and deploy tools
        uses: ./.github/actions/zenodo-release
        with:
          tool: ${{ matrix.tool }}
          artifact: ${{ matrix.artifact }}
          prevrecord: ${{ matrix.record }}
          token: ${{ secrets.zenodo_token }}

  deploy-maven:
    needs: [test-linux, check-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Publish to Maven Central (Dry Run)
        if: needs.check-release.outputs.is-release != 'true'
        uses: ./.github/actions/cache-build
        env:
          PGP_KEY: ${{ secrets.PGP_KEY }}
          PGP_PWD: ${{ secrets.PGP_PWD }}
        with:
          arguments: publishToMavenLocal
      - name: Publish to Maven Central
        if: needs.check-release.outputs.is-release == 'true'
        uses: ./.github/actions/cache-build
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          PGP_KEY: ${{ secrets.PGP_KEY }}
          PGP_PWD: ${{ secrets.PGP_PWD }}
        with:
          arguments: publishAggregationToCentralPortal
  
  test-docker:
    strategy:
      matrix:
        dockerprojects: ["theta-cfa-cli", "theta-sts-cli", "theta-xsts-cli", "theta-xta-cli", "theta-xcfa-cli"]
    runs-on: ubuntu-24.04
    steps:
      - name: Set java home to java 21
        run: |
          echo "JAVA_HOME=$(echo $JAVA_HOME_21_X64)" >> $GITHUB_ENV
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Version
        id: version
        run: |
          echo version=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{printf $2}') >> $GITHUB_OUTPUT
      - name: docker-login
        uses: ./.github/actions/docker-login
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          token: ${{secrets.DOCKER_TOKEN}}
      - name: docker-login-ghcr
        uses: ./.github/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          token: ${{secrets.GITHUB_TOKEN}}
      - name: Build and publish docker file 
        uses: ./.github/actions/docker-deploy
        with:
          project: ${{ matrix.dockerprojects }}
          version: ${{ steps.version.outputs.version }}
          user-dockerhub: ftsrg
          user-ghcr: ftsrg
          push: false
  
  deploy-docker:
    needs: [test-linux, test-docker, check-release]
    strategy:
      matrix:
        dockerprojects: ["theta-cfa-cli", "theta-sts-cli", "theta-xsts-cli", "theta-xta-cli", "theta-xcfa-cli"]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: version
        run: |
          echo version=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{printf $2}') >> $GITHUB_OUTPUT
      - name: docker-login
        if: needs.check-release.outputs.is-release == 'true'
        uses: ./.github/actions/docker-login
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          token: ${{secrets.DOCKER_TOKEN}}
      - name: docker-login-ghcr
        if: needs.check-release.outputs.is-release == 'true'
        uses: ./.github/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          token: ${{secrets.GITHUB_TOKEN}}
      - name: Build and publish docker file
        uses: ./.github/actions/docker-deploy
        with:
          project: ${{ matrix.dockerprojects }}
          version: ${{ steps.version.outputs.version }}
          user-dockerhub: ftsrg
          user-ghcr: ftsrg
          push: ${{ needs.check-release.outputs.is-release == 'true' }}
      - name: Docker Hub Description update
        if: needs.check-release.outputs.is-release == 'true'
        uses: peter-evans/dockerhub-description@dc67fad7001ef9e8e3c124cb7a64e16d0a63d864
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ftsrg/${{ matrix.dockerprojects }}

  deploy-docs:
    needs: [check-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
      - name: Setup Java 21
        uses: actions/setup-java@5ffc13f4174014e2d4d4572b3d74c3fa61aeb2c2 # v3.11.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          pip install --break-system-packages mkdocs mkdocs-material python-markdown-math mkdocs-awesome-pages-plugin
      - name: Build docs via Gradle
        uses: ./.github/actions/cache-build
        with:
          arguments: buildDocs
      - name: Deploy docs
        if: needs.check-release.outputs.is-release == 'true'
        uses: JamesIves/github-pages-deploy-action@22a6ee251d6f13c6ab1ecb200d974f1a6feb1b8d # v4.4.2
        with:
          branch: gh-pages
          folder: build/doc/wiki
          target-folder: wiki
          single-commit: true
