# The arguments a native image of xcfa-cli is built with (native-image -jar picks them up from the
# jar). The Kotlin script engine is left out: kts inputs and script portfolios need the JVM.
Args = --no-fallback \
       --features=hu.bme.mit.theta.xcfa.cli.nativeimage.ThetaNativeImageFeature \
       --initialize-at-build-time=kotlin.DeprecationLevel,org.slf4j \
       -H:+UnlockExperimentalVMOptions \
       -H:ServiceLoaderFeatureExcludeServices=javax.script.ScriptEngineFactory \
       -H:-UnlockExperimentalVMOptions
